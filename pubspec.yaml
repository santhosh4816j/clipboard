name: cliphold
description: "ClipHold - Your clipboard. Remembered. Private."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # SQLite (desktop-compatible, uses FFI on Windows)
  sqflite_common_ffi: ^2.3.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # Windows desktop window control (used to implement the compact
  # Alt+V popup by resizing/repositioning/showing-hiding the app window)
  window_manager: ^0.4.2

  # System tray (real native tray icon + menu)
  tray_manager: ^0.2.3

  # Global hotkey registration (real OS-level hotkey, not a Flutter-only shortcut)
  hotkey_manager: ^0.2.3

  # Real clipboard change monitoring via native OS clipboard listener
  clipboard_watcher: ^0.2.0

  # Utilities
  crypto: ^3.0.5
  uuid: ^4.4.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  msix: ^3.16.7

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

# MSIX packaging config for Microsoft Store submission.
# logo_path points at the full-resolution (1254x1254) master logo — the
# msix tool generates every required Store tile size/scale from this one
# source. This is what fixes certification error 10.1.1.11 (blurry/
# distorted tiles): the previous master was too small and got upscaled.
#
# Identity values below are copied exactly from Partner Center →
# ClipBox → Product identity. Do not edit these unless Partner Center
# itself shows different values (e.g. if you re-reserve the app).
msix_config:
  display_name: ClipBox
  publisher_display_name: santhosh4816j
  identity_name: santhosh4816j.ClipBox
  msix_version: 1.0.0.0
  logo_path: windows_config/resources/store_logo_master.png
  capabilities: ""
  publisher: CN=56A045A8-7F10-4271-9A86-566887D6E7CD

